name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
          SITE_URL: https://relationshipgoals.store

      # Publishes the built site to the `deploy` branch.
      # Hostinger (hPanel → Advanced → Git) pulls that branch into public_html.
      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: dist/apps/web/client
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

      # Optional: if HOSTINGER_DEPLOY_WEBHOOK is set (from hPanel → Git → Auto deployment),
      # tell Hostinger to pull right away.
      - name: Trigger Hostinger deploy
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"
